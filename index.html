<!DOCTYPE html>
<html>
<head>
  <title>Smart Meter Data Manager - Standalone</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Separate CSS file -->
  <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- 1. HEADER & SEARCH BAR -->
<div class="header-bar text-center">
    <div class="container">
        <h1>Smart Meter Data Manager</h1>
        <p class="lead">स्टैंडअलोन वेब ऐप (Google Sheets API)</p>
        <input type="text" id="searchInput" onkeyup="filterTable()" class="form-control search-input mx-auto mt-3" 
               placeholder="Account No., Old Meter No., New Meter No., या Box No. से खोजें...">
    </div>
</div>

<div class="container mt-4">
    <div class="row">
        
        <!-- 2. NEW ENTRY FORM -->
        <div class="col-md-4">
            <div class="card card-custom">
                <div class="card-header bg-primary text-white">नया मीटर डेटा जोड़ें</div>
                <div class="card-body">
                    <form id="meterDataForm"> 
                        <h6 class="text-secondary mb-3">Consumer Details</h6>
                        <div class="mb-3">
                            <label for="consumerAccountNo" class="form-label">Consumer Account No. <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="consumerAccountNo" name="consumerAccountNo" required>
                        </div>
                        <div class="mb-3">
                            <label for="oldMeterNo" class="form-label">Old Meter No. / New Meter No.</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="oldMeterNo" name="oldMeterNo" placeholder="Old Meter">
                                <input type="text" class="form-control" id="newMeterNo" name="newMeterNo" placeholder="New Meter">
                            </div>
                        </div>

                        <h6 class="text-secondary mb-3 mt-4">Readings</h6>
                        <div class="mb-3">
                            <label for="cumKWHReading" class="form-label">Cum KWH Reading</label>
                            <input type="number" class="form-control" id="cumKWHReading" name="cumKWHReading">
                        </div>
                        <div class="mb-3">
                            <label for="kwhMDReading" class="form-label">KWH MD Reading</label>
                            <input type="number" class="form-control" id="kwhMDReading" name="kwhMDReading">
                        </div>

                        <div class="mb-3">
                            <label for="boxNo" class="form-label">Box No. / Sealing No.</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="boxNo" name="boxNo" placeholder="Box No.">
                                <input type="text" class="form-control" id="sealingNo" name="sealingNo" placeholder="Sealing No.">
                            </div>
                        </div>
                        
                        <h6 class="text-secondary mb-3 mt-4">Images (Click Photo/Upload)</h6>
                        <div class="mb-3">
                            <label for="mdImage" class="form-label">KWH MD Image</label>
                            <input type="file" class="form-control mb-2" id="mdImage" name="mdImage" accept="image/*" capture="camera">
                        </div>
                        <div class="mb-3">
                            <label for="cumKWHImage" class="form-label">Cum KWH Image</label>
                            <input type="file" class="form-control mb-2" id="cumKWHImage" name="cumKWHImage" accept="image/*" capture="camera">
                        </div>
                        <div class="mb-3">
                            <label for="sealingImage" class="form-label">Sealing Image</label>
                            <input type="file" class="form-control" id="sealingImage" name="sealingImage" accept="image/*" capture="camera">
                        </div>

                        <div class="mb-3">
                            <label for="remarks" class="form-label">Remarks</label>
                            <textarea class="form-control" id="remarks" name="remarks" rows="2"></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 mt-3">डेटा अपलोड करें</button>
                    </form>
                    <div id="statusMessage" class="mt-3 text-center"></div>
                </div>
            </div>
        </div>

        <!-- 3. DATA DISPLAY TABLE -->
        <div class="col-md-8">
            <div class="card card-custom">
                <div class="card-header bg-secondary text-white">अपलोड किया गया डेटा (एडिट/देखें)</div>
                <div class="card-body data-table-container">
                    <table class="table table-sm table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Account No.</th>
                                <th>New Meter No.</th>
                                <th>Reading (KWH)</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title" id="editModalLabel">डेटा एडिट करें</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editDataForm">
            <input type="hidden" id="editRowIndex" name="rowIndex">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Consumer Account No.</label>
                    <input type="text" class="form-control" id="editConsumerAccountNo" name="consumerAccountNo" required readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="form-label">Box No. / Sealing No.</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="editBoxNo" name="boxNo" placeholder="Box No.">
                        <input type="text" class="form-control" id="editSealingNo" name="sealingNo" placeholder="Sealing No.">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Old Meter No.</label>
                    <input type="text" class="form-control" id="editOldMeterNo" name="oldMeterNo">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">New Meter No.</label>
                    <input type="text" class="form-control" id="editNewMeterNo" name="newMeterNo">
                </div>
            </div>
            
            <hr>
            <h6>Readings & Image Links</h6>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cum KWH Reading</label>
                    <input type="number" class="form-control" id="editCumKWHReading" name="cumKWHReading">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">KWH MD Reading</label>
                    <input type="number" class="form-control" id="editKwhMDReading" name="kwhMDReading">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">MD Image Link</label>
                <input type="url" class="form-control" id="editMdImageLink" name="mdImageLink" placeholder="Paste Drive Link">
            </div>
            <div class="mb-3">
                <label class="form-label">Sealing Image Link</label>
                <input type="url" class="form-control" id="editSealingImageLink" name="sealingImageLink" placeholder="Paste Drive Link">
            </div>

            <div class="mb-3">
                <label class="form-label">Remarks</label>
                <textarea class="form-control" id="editRemarks" name="remarks" rows="2"></textarea>
            </div>
            
            <button type="submit" class="btn btn-warning w-100 mt-3">अपडेट सेव करें</button>
            <div id="editStatusMessage" class="mt-3 text-center"></div>
        </form>
      </div>
    </div>
  </div>
</div>


<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Separate JavaScript file -->
<script src="script.js"></script>
</body>
</html>
